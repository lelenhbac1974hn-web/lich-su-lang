use",v:"dong_a",lv:[3,4],g:"b",ic:"🏠",t:"Nhà sàn mái cong thời Đông Sơn",n:"Trên mặt trống đồng Ngọc Lũ có khắc hình nhà sàn mái cong như con thuyền, hai đầu nóc vút cao. Cư dân Đông Sơn dựng nhà trên cột gỗ, mái lợp lá hoặc rạ; gầm sàn để nông cụ và nuôi gia súc.",b:"Mái nhà cong hình thuyền như vậy vẫn còn ở một số dân tộc Đông Nam Á, ví dụ người Toraja ở Indonesia.",tc:"S"},{id:"da_tt",o:"b:center",v:"dong_a",lv:[1,4],g:"b",ic:"🔥",t:"Trung tâm làng: chiềng, chạ",n:"Thời Văn Lang, người Việt cổ sống thành chiềng, chạ (làng). Đứng đầu chiềng, chạ là bồ chính, thường là người già có uy tín. Trung tâm làng là nơi họp bàn việc chung, chia ruộng, tổ chức lễ cầu mùa.",b:"Về sau, ngôi đình trở thành trung tâm của làng Việt: vừa là nơi thờ thành hoàng, vừa là nơi hội họp.",tc:"S"},{id:"da_xom",o:"b:hamlet",v:"dong_a",lv:[2,4],g:"b",ic:"🛖",t:"Xóm mới trên gò đất cao",n:"Khi dân đông, từng nhóm gia đình ra lập xóm mới. Ở đồng bằng sông Hồng, người xưa hay chọn gò đất cao ven sông: gần nước, gần ruộng mà ít bị ngập.",b:'Nhiều làng cổ ở Bắc Bộ còn mang tên "Gò", "Đống", "Cồn", dấu vết của chỗ đất cao người xưa chọn ở.',tc:"S"},{id:"da_kho",o:"b:granary",v:"dong_a",lv:[1,4],g:"b",ic:"🌾",t:"Kho thóc trên sàn cao",n:"Thóc lúa được cất trên sàn cao để tránh ẩm và chuột. Trên trống đồng Đông Sơn có hình người giã gạo bằng chày tay, cho thấy lúa gạo là lương thực chính.",b:"Ở các di chỉ Đồng Đậu, Gò Mun, nhà khảo cổ tìm thấy hạt gạo cháy (thóc than hóa) từ hơn 3.000 năm trước.",tc:"S"},{id:"da_mieu",o:"b:shrine",v:"dong_a",lv:[1,4],g:"b",ic:"🔥",t:"Nơi thờ thần sông, thần núi",n:"Người Việt cổ thờ các vị thần tự nhiên: thần Mặt Trời, thần sông, thần núi, và cầu cho mưa thuận gió hòa. Giữa mặt trống đồng thường là hình ngôi sao nhiều cánh, tượng trưng cho Mặt Trời.",b:"Truyền thuyết Sơn Tinh – Thủy Tinh phản ánh cuộc chống lũ lụt hằng năm của cư dân đồng bằng sông Hồng.",tc:"S"},{id:"da_hl",o:"job:gather",v:"dong_a",lv:[1,3],g:"job",ic:"🧺",t:"Hái lượm thời văn hóa Hòa Bình",n:"Người văn hóa Hòa Bình sống trong hang đá vôi, nhặt ốc suối, hái quả rừng, đào củ. Vỏ ốc họ ăn xong chất thành lớp dày trong hang. Người Bắc Sơn biết mài lưỡi rìu đá cho sắc.",b:"Nhờ lớp vỏ ốc, xương thú trong hang mà nhà khảo cổ biết người xưa ăn gì, sống ra sao.",tc:"S"},{id:"da_sb",o:"job:hunt",v:"dong_a",lv:[1,4],g:"job",ic:"🏹",t:"Săn bắt trong rừng nhiệt đới",n:"Người xưa săn hươu nai, lợn rừng, khỉ bằng lao, cung tên. Đến thời Đông Sơn, cư dân đã dùng nỏ bắn mũi tên đồng. Trên trống đồng có khắc hình hươu, chim bay.",b:"Truyền thuyết nỏ thần thời An Dương Vương cho thấy người Âu Lạc rất giỏi làm và dùng nỏ.",tc:"S"},{id:"da_ca",o:"job:fish",v:"dong_a",lv:[1,4],g:"job",ic:"🐟",t:"Đánh cá, mò hến ven sông biển",n:"Cư dân ven biển (Quỳnh Văn, Hạ Long) sống nhờ cá, sò, điệp; nhiều nơi còn cồn sò điệp người xưa để lại. Ở nhiều di chỉ có chì lưới bằng đất nung. Thuyền độc mộc khoét từ thân cây dùng đi lại và đánh bắt.",b:"Trên trống đồng Đông Sơn có hình những chiếc thuyền dài chở nhiều người, có người cầm mái chèo.",tc:"S"},{id:"da_tt1",o:"job:farm",v:"dong_a",lv:[1,4],g:"job",ic:"🌾",t:"Trồng lúa nước ven sông Hồng",n:"Từ thời Phùng Nguyên, cư dân ven sông Hồng đã trồng lúa nước, đắp bờ giữ nước trên ruộng. Thời Đông Sơn có lưỡi cày bằng đồng, việc làm ruộng mở rộng, lúa gạo thành lương thực chính.",b:"Phù sa sông Hồng mỗi mùa lũ bồi thêm đất màu, nhưng cũng buộc người xưa phải học cách sống chung với lũ.",tc:"S"},{id:"da_go",o:"job:wood",v:"dong_a",lv:[1,4],g:"job",ic:"🪓",t:"Đốn gỗ, khoét thuyền",n:"Với rìu đá mài, rồi rìu đồng, người xưa đốn gỗ dựng nhà sàn, khoét thân cây làm thuyền độc mộc. Cây to còn được khoét làm quan tài hình thuyền.",b:"Ở Việt Khê (Hải Phòng) đã tìm thấy mộ thuyền thời Đông Sơn: quan tài khoét từ cả thân cây, bên trong có đồ đồng chôn theo.",tc:"S"},{id:"da_xay",o:"job:build",v:"dong_a",lv:[1,4],g:"job",ic:"🔨",t:"Thợ dựng nhà, đắp thành",n:"Nhà sàn được dựng bằng cột gỗ, khung tre, nối bằng mộng và buộc lạt. Thời Âu Lạc, dân đắp thành Cổ Loa bằng đất với ba vòng thành, có hào nước bao quanh.",b:"Thành Cổ Loa (Đông Anh, Hà Nội) là tòa thành cổ lớn nhất còn dấu tích ở nước ta.",tc:"S"},{id:"da_cung",o:"job:priest",v:"dong_a",lv:[1,4],g:"job",ic:"🔥",t:"Người làm lễ cầu mùa",n:"Người làm lễ giữ việc cúng thần, cầu mưa, cầu mùa và chữa bệnh theo tín ngưỡng xưa. Trống đồng khắc cảnh người hóa trang lông chim nhảy múa, đánh trống trong ngày hội.",b:"Tục thờ cúng tổ tiên, thờ thần tự nhiên của người Việt có gốc rễ từ rất sớm.",tc:"S"},{id:"da_cn",o:"job:herd",v:"dong_a",lv:[2,4],g:"job",ic:"🐖",t:"Chăn nuôi lợn, gà, trâu bò",n:"Người Việt cổ nuôi chó, lợn, gà, về sau thêm trâu bò. Gia súc thường được nuôi dưới gầm nhà sàn.",b:"Ở nhiều di chỉ thời đồ đồng tìm thấy tượng gà, bò nhỏ bằng đất nung.",tc:"S"},{id:"da_da",o:"job:stone",v:"dong_a",lv:[2,4],g:"job",ic:"🪨",t:"Thợ đá làm rìu, vòng trang sức",n:"Thợ đá thời Phùng Nguyên rất khéo: mài rìu, bôn, đục; tiện vòng tay, khuyên tai bằng đá nhẵn bóng.",b:"Đồ trang sức đá Phùng Nguyên tròn đều đến mức nhiều người cho rằng thợ xưa đã biết dùng bàn xoay.",tc:"S"},{id:"da_mo",o:"job:mine",v:"dong_a",lv:[2,4],g:"job",ic:"⛏️",t:"Tìm quặng đồng, thiếc",n:"Đồng thau là hợp kim của đồng và thiếc. Người xưa tìm quặng ở vùng núi, nấu chảy rồi đúc thành công cụ, vũ khí, đồ dùng.",b:"Biết luyện kim là bước ngoặt: công cụ bằng kim loại sắc và bền hơn công cụ đá rất nhiều.",tc:"S"},{id:"da_duc",o:"job:craft",v:"dong_a",lv:[2,4],g:"job",ic:"⚒️",t:"Thợ đúc đồng",n:"Thợ đúc rót đồng nóng chảy vào khuôn bằng đá hoặc đất để làm rìu, giáo, mũi tên, lưỡi cày và cả trống đồng. Trống đồng Ngọc Lũ, Hoàng Hạ là đỉnh cao của nghề đúc thời Đông Sơn.",b:"Khuôn đúc rìu bằng đá đã được tìm thấy ở nhiều di chỉ thời đồ đồng ở đồng bằng Bắc Bộ.",tc:"S"},{id:"da_tn",o:"job:trade",v:"dong_a",lv:[2,4],g:"job",ic:"💰",t:"Trao đổi hàng hóa",n:"Các làng đổi muối, cá, lúa gạo, đồ gốm, đồ đồng cho nhau. Trống đồng kiểu Đông Sơn được tìm thấy ở nhiều nơi trong Đông Nam Á, cho thấy người xưa đã giao lưu rộng.",b:"Trống đồng Đông Sơn có mặt ở Thái Lan, Lào, Malaysia, Indonesia.",tc:"S"},{id:"da_gc",o:"job:scholar",v:"dong_a",lv:[2,4],g:"job",ic:"📜",t:"Giữ tri thức bằng lời và hoa văn",n:"Thời Văn Lang – Âu Lạc chưa có chữ viết được xác nhận. Tri thức về mùa vụ, thời tiết, phong tục được truyền miệng qua truyền thuyết, câu hát và ghi lại bằng hoa văn trên đồ đồng.",b:"Chữ Hán vào nước ta trong thời Bắc thuộc. Mãi về sau người Việt mới có chữ Nôm, rồi chữ Quốc ngữ.",tc:"S"},{id:"da_bl",o:"job:soldier",v:"dong_a",lv:[2,4],g:"job",ic:"🛡️",t:"Dân binh giữ làng",n:"Khi có giặc, trai tráng trong làng cầm giáo, lao, rìu chiến, nỏ ra giữ làng. Thời Âu Lạc có thành Cổ Loa và đội quân giỏi dùng nỏ.",b:"Mũi tên đồng tìm thấy ở Cổ Loa có tới hàng vạn chiếc.",tc:"S"},{id:"da_quan",o:"job:official",v:"dong_a",lv:[3,4],g:"job",ic:"⚖️",t:"Lạc hầu, Lạc tướng",n:"Giúp vua Hùng có Lạc hầu (quan văn) và Lạc tướng (quan võ). Cả nước chia thành 15 bộ, mỗi bộ do một Lạc tướng cai quản; dưới bộ là các chiềng, chạ.",b:"Nhà nước Văn Lang còn đơn giản, chưa có luật pháp thành văn và quân đội thường trực.",tc:"S"},{id:"da_ruong",o:"t:farm",v:"dong_a",lv:[1,4],g:"tn",ic:"🌾",t:"Ruộng lúa nước",n:"Ruộng được đắp bờ để giữ nước. Đất phù sa ven sông màu mỡ nên lúa tốt. Người xưa gieo cấy theo mùa nước lên, nước xuống của sông.",b:"Nghề trồng lúa nước là nền tảng của văn minh sông Hồng, sông Mã, sông Cả.",tc:"S"},{id:"da_hang",o:"lm:cave",v:"dong_a",lv:[1,4],g:"tn",ic:"🕳️",t:"Hang đá có người xưa ở",n:"Nhiều hang động vùng núi đá vôi từng là nhà của người tiền sử. Hang Con Moong (Thanh Hóa) có dấu tích người ở liên tục qua nhiều thời kỳ: Sơn Vi, Hòa Bình, Bắc Sơn.",b:"Lớp đất trong hang như những trang sách: càng xuống sâu càng cổ.",tc:"S"},{id:"da_vd",o:"lm:stones",v:"dong_a",lv:[1,4],g:"tn",ic:"🪨",t:"Bãi đá cổ có hình khắc",n:"Ở Sa Pa (Lào Cai) có bãi đá cổ với nhiều hình khắc: đường xoắn, hình người, hình ô ruộng. Đến nay người ta vẫn bàn nhiều về ý nghĩa của chúng.",b:"Bãi đá cổ Sa Pa đã được xếp hạng di tích quốc gia đặc biệt.",tc:"S"},{id:"td_nha",o:"b:house",v:"trung_dong",lv:[1,2],g:"b",ic:"🛖",t:"Nhà đất ven sông Nin",n:"Nhà tròn hoặc bầu dục dựng khung cọc, trát bùn phù sa sông Nin, lợp sậy. Kiểu nhà này thấy ở khu định cư Merimde, khoảng 5.000 năm trước Công nguyên.",b:"Bùn sông Nin về sau được đóng thành gạch phơi nắng, vật liệu xây dựng chính của Ai Cập cổ suốt hàng nghìn năm.",tc:"S"},{id:"td_hl",o:"job:gather",v:"trung_dong",lv:[1,2],g:"job",ic:"🌾",t:"Gặt lúa mì hoang",n:"Người Natufian ở vùng Cận Đông gặt lúa mì, lúa mạch mọc hoang bằng liềm lưỡi đá lửa, giã hạt bằng cối đá. Đây là bước đệm trước khi con người biết trồng trọt.",b:"Vùng Lưỡi liềm Màu mỡ là một trong những nơi con người làm nông nghiệp sớm nhất thế giới.",tc:"S"},{id:"td_tt",o:"job:farm",v:"trung_dong",lv:[1,4],g:"job",ic:"🌾",t:"Làm ruộng theo lũ sông Nin",n:"Mỗi năm sông Nin lên lũ rồi rút, để lại lớp phù sa đen. Nông dân gieo lúa mì, lúa mạch sau khi nước rút. Người Ai Cập chia năm làm ba mùa: mùa lũ, mùa gieo trồng, mùa gặt.",b:'Người Ai Cập cổ gọi đất nước mình là Kemet, nghĩa là "Đất Đen", theo màu phù sa sông Nin.',tc:"S"},{id:"all_nha",o:"b:house",v:"all",lv:[1,4],g:"b",ic:"🛖",t:"Nhà ở thời sơ khai",n:"Người xưa dựng nhà bằng vật liệu sẵn có quanh mình: gỗ, tre, lau sậy, đất sét, đá. Nhà nhỏ, một gian, bếp lửa ở giữa vừa nấu ăn vừa sưởi ấm.",b:"Nhìn vật liệu làm nhà, có thể đoán được khí hậu và cảnh quan nơi người xưa sống.",tc:"S"},{id:"all_ruong",o:"t:farm",v:"all",lv:[1,4],g:"tn",ic:"🌾",t:"Những thửa ruộng đầu tiên",n:"Khi biết trồng trọt, con người ở lại một chỗ, dựng làng, tích trữ lương thực. Đất ven sông có phù sa nên được khai phá làm ruộng sớm nhất.",b:"Nông nghiệp ra đời độc lập ở nhiều nơi: Cận Đông (lúa mì), Trung Quốc (lúa, kê), Trung Mỹ (ngô), New Guinea (khoai).",tc:"S"},{id:"all_song",o:"t:river",v:"all",lv:[1,13],g:"tn",ic:"🏞️",t:"Dòng sông – nơi văn minh ra đời",n:"Sông cho nước uống, cá tôm, phù sa và là con đường đi lại. Các nền văn minh lớn đầu tiên đều mọc lên ven sông: sông Nin, Lưỡng Hà, sông Ấn, Hoàng Hà, sông Hồng.",b:"Lũ sông vừa mang phù sa vừa gây tai họa, nên trị thủy là một trong những việc lớn nhất của các nhà nước cổ.",tc:"S"},{id:"all_hang",o:"lm:cave",v:"all",lv:[1,13],g:"tn",ic:"🕳️",t:"Hang đá cổ",n:"Hang đá là nơi trú ẩn tự nhiên của người tiền sử: tránh mưa gió, thú dữ. Trong hang thường còn bếp lửa, công cụ đá, xương thú và có khi cả tranh vẽ trên vách.",b:"Tranh hang động cổ nhất được biết có tuổi hàng chục nghìn năm.",tc:"S"},{id:"all_vd",o:"lm:stones",v:"all",lv:[1,13],g:"tn",ic:"🪨",t:"Vòng đá cổ",n:"Những khối đá lớn dựng thành vòng tròn hay hàng thẳng là nơi làm lễ, chôn cất, hoặc để theo dõi Mặt Trời, mùa vụ. Nổi tiếng nhất là Stonehenge ở nước Anh.",b:"Một số trục đá ở Stonehenge thẳng hàng với hướng Mặt Trời mọc ngày hạ chí.",tc:"S"},{id:"all_cay",o:"lm:oldtree",v:"all",lv:[1,13],g:"tn",ic:"🌳",t:"Cây cổ thụ",n:"Cây to lâu năm thường được dân làng coi là thiêng, là nơi tụ họp, nghỉ chân, làm lễ. Ở làng Việt, cây đa đầu làng gắn với giếng nước và mái đình.",b:"Có những cây sống hàng nghìn năm, chứng kiến nhiều thế hệ người trong làng.",tc:"S"},{id:"all_pt",o:"lm:ruin",v:"all",lv:[1,13],g:"tn",ic:"🏚️",t:"Phế tích cổ",n:"Dấu vết của một khu dân cư cũ đã bị bỏ hoang: nền nhà, tường đổ, mảnh gốm. Nhà khảo cổ đào lớp đất, xếp mảnh vỡ để dựng lại cuộc sống xưa.",b:"Mảnh gốm vỡ là loại di vật hay gặp nhất, giúp xác định niên đại của di chỉ.",tc:"S"},{id:"kp_gieng",o:"kp:gieng",v:"all",lv:[2,13],g:"kp",r:1,ic:"💧",t:"Giếng làng",n:"Dân làng đào sâu tới mạch nước ngầm, kè đá thành giếng cho khỏi sụt. Có giếng, làng không còn phụ thuộc nước sông mùa cạn, người ốm vì nước bẩn cũng ít hơn.",b:"Ở làng quê Việt Nam, cây đa, giếng nước, sân đình là hình ảnh quen thuộc nhất.",tc:"S"},{id:"kp_ducdong",o:"kp:ducdong",v:"dong_a",lv:[2,4],g:"kp",r:1,ic:"🔥",t:"Lò đúc đồng đầu tiên",n:"Thợ làng học được cách nấu quặng đồng với thiếc thành đồng thau rồi rót vào khuôn đá. Từ đây có rìu đồng, giáo đồng, lưỡi cày đồng.",b:"Các
