html.pxf body,html.pxf button,html.pxf input,html.pxf select{font-family:'VT323',ui-monospace,monospace;font-size:17px;letter-spacing:.2px}
#land{position:fixed;inset:0;z-index:60;background:#2d2a5a;overflow:hidden;transition:opacity .45s ease;font-family:'VT323',ui-monospace,monospace;color:#f4ecd8}
#land.out{opacity:0;pointer-events:none}
#land canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#land .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,30,.45) 0,rgba(10,10,30,0) 34%,rgba(10,10,30,0) 56%,rgba(8,12,30,.78) 100%);pointer-events:none}
#land .col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(26px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));text-align:center}
#land .top{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:2vh}
#land .logo{width:84px;height:84px;image-rendering:pixelated;border-radius:18px;border:3px solid #ffe9a8;box-shadow:0 6px 0 #6b3a1e,0 0 28px rgba(255,200,100,.45)}
#land h1{margin:6px 0 0;font:400 clamp(46px,15vw,88px)/.95 'VT323',monospace;letter-spacing:3px;color:#ffe9a8;text-shadow:0 4px 0 #6b3a1e,0 0 26px rgba(255,190,90,.5);text-transform:uppercase}
#land .tag{text-wrap:balance;font-size:21px;line-height:1.15;max-width:22em;color:#fff3d6;text-shadow:0 2px 0 rgba(0,0,0,.55)}
#land .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
#land .chips span{background:rgba(20,16,40,.55);border:2px solid rgba(255,233,168,.55);border-radius:6px;padding:1px 9px;font-size:19px;color:#ffe9a8}
#land .bot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:360px}
#land .go{width:100%;font:400 32px/1 'VT323',monospace;letter-spacing:1px;color:#3a2410;background:#f2b84b;border:3px solid #ffe9a8;border-bottom-width:7px;border-bottom-color:#a8661f;border-radius:10px;padding:12px 10px 8px;cursor:pointer;animation:landpulse 1.8s ease-in-out infinite}
#land .go:active{transform:translateY(4px);border-bottom-width:3px;animation:none}
#land .sv{font-size:20px;color:#fff3d6;text-shadow:0 2px 0 rgba(0,0,0,.6);min-height:1em}
#land .lrow{display:flex;gap:10px}
#land .lbtn{white-space:nowrap;font:400 20px 'VT323',monospace;color:#fff3d6;background:rgba(20,16,40,.55);border:2px solid rgba(255,233,168,.5);border-radius:8px;padding:3px 12px;cursor:pointer}
#land .ft{font-size:16px;color:rgba(255,243,214,.75);text-shadow:0 1px 0 rgba(0,0,0,.6)}
@keyframes landpulse{50%{box-shadow:0 0 0 6px rgba(255,233,168,.22)}}
@media (prefers-reduced-motion:reduce){#land .go{animation:none}}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
button:hover{border-color:#5a6070}
button.on{background:var(--acc);color:#222;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.35;cursor:default}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;flex-wrap:nowrap;align-items:center;gap:4px 10px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#era{font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
#year,#yrs{color:var(--mut);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
#yrs{color:#c9b98a}
#info{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden}
#ctrl{margin-left:auto;display:flex;align-items:center;gap:3px}
#ctrl button{padding:3px 0;font-size:12.5px;min-width:30px;height:28px;border-radius:7px}
#bPlay{min-width:34px!important;font-size:14px!important}
#speeds{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-right:4px}
#speeds button{border:0;border-radius:0;min-width:31px;background:var(--panel2);font-weight:600}
#speeds button+button{border-left:1px solid var(--line)}
#speeds button.on{background:var(--acc);color:#222}
#res{display:grid;grid-template-columns:repeat(6,minmax(0,138px));gap:1px 8px;padding:4px 8px;background:#1f2228;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
#res .rc{white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
#res .rc.w2{grid-column:span 2}
#res .rc.off{opacity:.28}
#res .neg{color:var(--bad)} #res .pos{color:var(--ok)}
#main{flex:1;display:flex;min-height:0}
#cw{flex:1;position:relative;min-width:0;background:#1f4e79;touch-action:none}
canvas#cv{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:36px;height:36px;font-size:18px;padding:0;background:rgba(35,38,45,.85)}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,22,26,.9);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}
#panel{width:340px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut)}
#tabs button.on{color:var(--acc);border-bottom:2px solid var(--acc);font-weight:600;background:none}
#tabs #fold{flex:0 0 34px;display:none}
#pb{flex:1;overflow-y:auto;padding:8px 10px}
.row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed #333842}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--mut);font-size:11px}
.row .ct{width:30px;text-align:center;font-weight:700}
.row button{width:32px;height:30px;padding:0}
.row.lock{opacity:.4}
.hint{color:var(--mut);font-size:12px;margin:6px 0}
.bar{height:8px;background:#383d47;border-radius:4px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.done i{background:var(--ok)}
h3{margin:8px 0 6px;font-size:14px;color:var(--acc)}
.log p{margin:0 0 5px;font-size:12px;line-height:1.35}
.log b{color:var(--acc);font-weight:600}
.lin{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:6px 0;background:#383d47}
.leg span{display:inline-block;margin:2px 8px 2px 0;font-size:12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.road div{font-size:12px;padding:2px 0;color:var(--mut)}
.road div.cur{color:var(--acc);font-weight:700}
.road div.done{color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:520px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;padding:0}
#mhead{flex:none;padding:14px 16px 4px;border-bottom:1px solid var(--line)}
#mbody{flex:1 1 auto;overflow-y:auto;padding:4px 16px 8px;min-height:0}
#mbody:empty{display:none}
#mbox h2{margin:0 0 4px;font-size:18px;color:var(--acc)}
#mbox .sub{color:var(--mut);font-size:12px;margin-bottom:8px}
#mbox p{margin:6px 0;line-height:1.45}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:9px 11px;border-radius:10px;border-left-width:6px}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function genMap(seed){

  const e=elev[i];

  if(e>eHill){tiles[i]=TL.HILL;continue}

 if(GEN2){

 {const MZ=(eMount-eSea)*0.05,N=W*H,F=new Float64Array(N),dir=new Int32Array(N).fill(-1),seen=new Uint8Array(N),ord=[],hk=[],hi=[],eps=1e-5;
  const push=(e,i)=>{hk.push(e);hi.push(i);let k=hk.length-1;while(k>0){const q=(k-1)>>1;if(hk[q]<=hk[k])break;[hk[q],hk[k]]=[hk[k],hk[q]];[hi[q],hi[k]]=[hi[k],hi[q]];k=q}};
  const pop=()=>{const r=hi[0],le=hk.pop(),li=hi.pop();if(hk.length){hk[0]=le;hi[0]=li;let k=0;for(;;){const l=2*k+1,r2=l+1;let m=k;if(l<hk.length&&hk[l]<hk[m])m=l;if(r2<hk.length&&hk[r2]<hk[m])m=r2;if(m===k)break;[hk[m],hk[k]]=[hk[k],hk[m]];[hi[m],hi[k]]=[hi[k],hi[m]];k=m}}return r};
  let sea=0;for(let i=0;i<N;i++)if(tiles[i]===TL.DEEP){F[i]=elev[i];seen[i]=1;push(elev[i],i);sea++}
  if(!sea)for(let i=0;i<N;i++){const x=i%W,y=(i/W)|0;if(x===0||y===0||x===W-1||y===H-1){F[i]=elev[i];seen[i]=1;push(elev[i],i)}}
  while(hk.length){const i=pop();ord.push(i);const x=i%W,y=(i/W)|0;for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(seen[j])continue;seen[j]=1;F[j]=Math.max(elev[j],F[i]+eps);dir[j]=i;push(F[j]+(F[j]-elev[j]<1e-9?0:1)*MZ*fbm(nx/4+70,ny/4+70,seed+29,2),j)}}

  const dL=(eMount-eSea)*0.06,lk=new Uint8Array(N);for(let i=0;i<N;i++)if(tiles[i]!==TL.DEEP&&tiles[i]!==TL.MOUNT&&F[i]-elev[i]>dL)lk[i]=1;
  {const vis=new Uint8Array(N),LKS=[];for(let i=0;i<N;i++){if(!lk[i]||vis[i])continue;const comp=[i];vis[i]=1;for(let h=0;h<comp.length;h++){const c=comp[h],x=c%W,y=(c/W)|0;for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(lk[j]&&!vis[j]){vis[j]=1;comp.push(j)}}}
    if(comp.length>=4&&comp.length<=45)LKS.push(comp)}
   LKS.sort((p,q)=>q.length-p.length);for(const comp of LKS.slice(0,Math.round(3*Math.pow(W*H/3888,0.5))))for(const c of comp)tiles[c]=TL.LAKE}
  // B3 sông: từ đầu nguồn trên núi đi theo hướng chảy tới biển (hoặc gặp sông khác); qua hồ thì đi tiếp từ cửa xả
  const srcs=[];for(let i=0;i<N;i++)if(tiles[i]===TL.MOUNT||tiles[i]===TL.HILL)srcs.push(i);srcs.sort((a,b)=>elev[b]-elev[a]);
  const used=[],nR=Math.round(((P.riv||3)+Math.floor(R()*2))*Math.pow(W*H/3888,0.6));
  for(const s of srcs){if(used.length>=nR)break;const sx0=s%W,sy0=(s/W)|0;if(sx0<3||sy0<3||sx0>W-4||sy0>H-4)continue;if(used.some(u=>Math.hypot(u%W-sx0,((u/W)|0)-sy0)<14))continue;if(R()<.35)continue;
   // nguồn phải đủ dài tới biển (≥ 12 ô) mới thành sông
   let n=0,c=s;while(c>=0&&tiles[c]!==TL.DEEP&&n<400){c=dir[c];n++}if(n<12||c<0)continue;used.push(s);
   let st=0;c=s;while(c>=0&&st++<400){const t=tiles[c];if(t===TL.DEEP)break;if(t===TL.RIVER&&st>1)break;if(t!==TL.LAKE&&(t!==TL.MOUNT||st>3))tiles[c]=TL.RIVER;c=dir[c]}}
 }
 } else {

 const srcs=[];for(let i=0;i<W*H;i++)if(tiles[i]===TL.MOUNT||tiles[i]===TL.HILL)srcs.push(i);
 srcs.sort((a,b)=>elev[b]-elev[a]);
 const used=[],nR=Math.round(((P.riv||3)+Math.floor(R()*2))*Math.pow(W*H/3888,0.6));
 for(const s of srcs){
  if(used.length>=nR)break;
  const sx0=s%W,sy0=(s/W)|0;
  if(sx0<3||sy0<3||sx0>W-4||sy0>H-4)continue;
  if(used.some(u=>Math.hypot(u%W-sx0,((u/W)|0)-sy0)<14))continue;

   let best=null,bv=1e9;
   for(const[dx,dy]of N4){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny))continue;const ni=idx(nx,ny);if(path.has(ni))continue;const v=elev[ni]+R()*0.02;if(v<bv){bv=v;best=[nx,ny]}}
   if(!best){break}

  }

 }
 }
 // hồ nhỏ
 for(let k=0;k<2;k++){const i=land[Math.floor(R()*land.length)];const lx=i%W,ly=(i/W)|0;if(tiles[i]===TL.PLAIN||tiles[i]===TL.FOREST){tiles[i]=TL.LAKE;for(const[dx,dy]of N4)if(inb(lx+dx,ly+dy)&&R()<.6&&tiles[idx(lx+dx,ly+dy)]!==TL.MOUNT)tiles[idx(lx+dx,ly+dy)]=TL.LAKE}}
 // biển nông, bãi cát
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);if(tiles[i]!==TL.DEEP)continue;for(const[dx,dy]of N8){const nx=x+dx,ny=y+dy;if(inb(nx,ny)){const t=tiles[idx(nx,ny)];if(t!==TL.DEEP&&t!==TL.SHALLOW){tiles[i]=TL.SHALLOW;break}}}}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y);const t=tiles[i];if(t!==TL.PLAIN&&t!==TL.DESERT&&t!==TL.FOREST)continue;for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&tiles[idx(nx,ny)]===TL.SHALLOW&&elev[i]<eSea+0.03){tiles[i]=TL.BEACH;break}}}

let COMP=null;
const walkT=i=>!isWater(S.tiles[i])||BRIDGESET.has(i);
function calcComp(){COMP=new Int32Array(W*H).fill(-1);let id=0;for(let i=0;i<W*H;i++){if(COMP[i]>=0||!walkT(i))continue;const q=[i];COMP[i]=id;while(q.length){const j=q.pop(),x=j%W,y=(j/W)|0;for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const k=idx(nx,ny);if(COMP[k]<0&&walkT(k)){COMP[k]=id;q.push(k)}}}id++}}
function tileAt(px,py){return idx(Math.max(0,Math.min(W-1,(px/T)|0)),Math.max(0,Math.min(H-1,(py/T)|0)))}
function losW(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/3));for(let k=1;k<=n;k++)if(!walkT(tileAt(x0+(x1-x0)*k/n,y0+(y1-y0)*k/n)))return false;return true}
function walkPath(a,b){

 const g=new Float64Array(W*H).fill(1e9),prev=new Int32Array(W*H).fill(-1),hp=[];const bx=b%W,by=(b/W)|0,h=i=>Math.abs(i%W-bx)+Math.abs(((i/W)|0)-by);

 const push=(v,f)=>{if(hn>=HK.length){const K2=new Float64Array(HK.length*2),V2=new Int32Array(HK.length*2);K2.set(HK);V2.set(HV);HK=K2;HV=V2}let k=hn++;while(k>0){const p=(k-1)>>1;if(HK[p]<=f)break;HK[k]=HK[p];HV[k]=HV[p];k=p}HK[k]=f;HV[k]=v};

 g[a]=0;push(a,h(a));
 while(hn){pop();const f=PF,i=PI;if(i===b)break;if(f>g[i]+h(i)+1e-6)continue;const x=i%W,y=(i/W)|0;

 if(a!==b&&prev[b]<0)return null;const path=[];for(let i=b;i!==-1;i=prev[i]){path.push(i);if(i===a)break}return path.reverse();

function goTo(a,pt,st){

 if(!walkT(ti)){const c=tileAt(pt.x*T+8,pt.y*T+8);let f=-1;if(walkT(c))f=c;else{const cx=c%W,cy=(c/W)|0;for(const[dx,dy]of N8){if(inb(cx+dx,cy+dy)&&walkT(idx(cx+dx,cy+dy))){f=idx(cx+dx,cy+dy);break}}}

  const out=[];let cx=a.px,cy=a.py,i=0;while(i<pts.length){let j=Math.min(pts.length-1,i+16);while(j>i&&!losW(cx,cy,pts[j][0],pts[j][1]))j--;out.push(pts[j]);cx=pts[j][0];cy=pts[j][1];i=j+1}

}
function updAgents(dt,anim){
 for(const p of S.people){const a=AG.get(p.id);if(!a)continue;a.p=p;
  if(a.st==='go'||a.st==='back'){
   const dx=a.tx-a.px,dy=a.ty-a.py,d=Math.hypot(dx,dy),sp=(p.age<14?10:13)*anim*dt*(S.tiles[tileAt(a.px,a.py)]===TL.ROAD?1.3:1);
   if(d<=sp&&a.path&&a.path.length){a.px=a.tx;a.py=a.ty;const n=a.path.shift();a.tx=n[0];a.ty=n[1]}
   else if(d<=sp){a.px=a.tx;a.py=a.ty;a.t=a.st==='go'?(3+rnd()*4):(1.5+rnd()*2.5);a.st=a.st==='go'?'work':'rest'}
   else{const ox=(a.px/T)|0,oy=(a.py/T)|0;a.px+=dx/d*sp;a.py+=dy/d*sp;const nx=(a.px/T)|0,ny=(a.py/T)|0;
    if((nx!==ox||ny!==oy)&&inb(nx,ny)){const i=idx(nx,ny);const f=(FOOT[i]=(FOOT[i]||0)+1);if(f>70&&(S.tiles[i]===TL.PLAIN||S.tiles[i]===TL.STUMP)&&NEAR.mask&&NEAR.mask[i])setTile(i,TL.PATH)}}

}

 const land=t=>![TL.RIVER,TL.LAKE,TL.SHALLOW,TL.DEEP,TL.MOUNT].includes(t);let n=0;
 for(const dir of[-1,1])for(const yo of[Math.floor(fp/2),0,fp-1]){let st=-1;for(let k=1;k<=4;k++){const x=dir<0?b.x-k:b.x+fp-1+k,y=b.y+yo;if(!inb(x,y))break;const i=idx(x,y);if(land(S.tiles[i])&&!RESV.has(i)){st=i;break}}
  if(st<0)continue;let best=null,bd=1e9;for(const s of S.settles){const d=Math.hypot(s.x-st%W,s.y-((st/W)|0));if(d<bd){bd=d;best=s}}if(!best)break;
  const p=findPath(st,idx(best.x,best.y));if(p&&p.length>1){applyRoad(p);n++}break}
 added.forEach(i=>RESV.delete(i));if(n){S.flags.bconn=S.flags.bconn||{};S.flags.bconn[m]=1;logMsg(`${MONU[m].n} đã nối vào mạng đường hai đầu cầu.`)}}catch(e){}}

const DAY_LEN=50,SEASON_LEN=80,SEASONS=[['🌸','Xuân'],['☀️','Hạ'],['🍂','Thu'],['❄️','Đông']];
const ENV={t:8,rt:0,season:0,night:0,weather:null,wUntil:0,wNext:25,drops:[],smoke:[],parts:[],amb:[],birds:[],shake:0,banner:null,fire:[],sparkle:[],comet:null};
function envUpdate(dt,run){
 ENV.rt+=dt;
 if(run)ENV.t+=dt;
 const d=0.5+0.5*Math.cos(TAU*ENV.t/DAY_LEN);
 ENV.night=Math.max(0,(0.42-d)/0.42);
 const se=Math.floor(ENV.t/SEASON_LEN)%4;if(se!==ENV.season){ENV.season=se;objDirty=true;updateSeasonBadge()}
 if(run&&ENV.rt>ENV.wNext){ENV.wNext=ENV.rt+18+rnd()*25;const r=rnd();ENV.weather=ENV.season===3?(r<.6?'snow':null):(ENV.season!==1&&r<.35)||(ENV.season===1&&r<.2)?'rain':null;ENV.wUntil=ENV.rt+10+rnd()*8}
 if(ENV.weather&&ENV.rt>ENV.wUntil)ENV.weather=null;
 if(ENV.shake>0)ENV.shake=Math.max(0,ENV.shake-dt);
 if(ENV.banner&&ENV.rt>ENV.banner.end)ENV.banner=null;
}

 if(boats.length<Math.min(MAXLV,1+(S.level>=2?2:0)+(countFish>0?1:0))&&N.waterWide.length&&rnd()<0.03){const i=pick(N.waterWide);ENV.amb.push({k:'boat',x:(i%W)*T+8,y:((i/W)|0)*T+9,tx:0,ty:0,w:0,lin:pickLin()||pick(LINK)})}
 if(deer.length<(S.level>=3?2:4)&&N.forestWide.length&&rnd()<0.03){const i=pick(N.forestWide);ENV.amb.push({k:'deer',x:(i%W)*T+8,y:((i/W)|0)*T+12,tx:0,ty:0,w:0})}
 for(const a of ENV.amb){
  if(a.k==='ship'||a.k==='cart'||a.k==='tr2'||a.k==='veh')continue;
  if(a.w>0){a.w-=dt*anim;continue}
  const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);
  if(d<0.5||!a.tx){const tx=(a.x/T)|0,ty=(a.y/T)|0;const ok=a.k==='boat'?isWater:(t=>t===TL.FOREST||t===TL.JUNGLE||t===TL.PLAIN);

   if(!found)a.dead=1;a.w=1+rnd()*3;continue}
  const sp=(a.k==='boat'?5:7)*anim*dt;a.x+=dx/d*Math.min(sp,d);a.y+=dy/d*Math.min(sp,d);a.dir=dx<0?-1:1;
 }

}

let CIVOPEN=null;
const GDESC={
 ds:'Đời sống cơ bản của dân: có đủ ăn, đủ nhà ở và sống được lâu không.',
 vc:'Của cải vật chất mỗi người lao động làm ra trong năm: lương thực, gỗ, đá, kim loại, của cải.',
 kt:'Trình độ hiểu biết và kỹ thuật: tri thức làm ra mỗi năm và số phát minh. KHKT càng cao, mọi nghề làm càng giỏi.',

const GWT={ds:20,vc:25,kt:20,tt:15,xh:20};
function civJobs(ids){const L=[];for(const id of ids){if(!JOB[id])continue;if(jobAlive(id)&&jobUsable(id))L.push(`<span class="jb">${JOB[id].ic} <span>${jobName(id)}</span></span>`);}return L}
function civNext(ids){let b=null;for(const id of ids){const j=JOB[id];if(!j||j.lv<=S.level)continue;if(LIFE[id]&&LIFE[id].end<=j.lv)continue;if(!b||j.lv<b.lv)b=j}return b?`<span class="jb">${b.ic} <span>${jobName(b.id,b.lv)}</span> <small>(mở ở cấp ${b.lv})</small></span>`:''}
function civSub(t,val,score,need){const ok=score>=0.8;return`<div class="sub"><em>${ok?'✅':score>=0.4?'🟡':'⚠️'}</em><span><span>${t}</span>${need?`<br><small class="hint">${need}</small>`:''}</span><b>${val}</b></div>`}
function civParts(g){
 const c=countJobs(),pop=Math.max(1,S.people.length),wk=Math.max(1,pop-c.child-c.elder),r=S.rates||{};const L=[];
 if(g==='ds'){const fr=S.foodRatio||0,hc=housingCap()/pop,life=S.stats.deaths>5?S.stats.deathAge/S.stats.deaths:45;
  L.push(civSub('Lương thực làm ra so với ăn',fmt(fr*100)+'%',sat(fr,0.85,1.35),'tốt khi ≥ 135%'));
  L.push(civSub('Chỗ ở so với số dân',fmt(hc*100)+'%',sat(hc,0.9,1.2),'tốt khi ≥ 120%'));
  L.push(civSub('Tuổi thọ bình quân',fmt(life)+' tuổi',sat(life,25,55),'tốt khi ≥ 55'));}
 if(g==='vc'){const norm=[0,1.9,2.6,3.4,3.6,3.8,4.2,5.3,5.9,6.6,7.4,7.8,8.2,8.6][Math.min(MAXLV,S.level)];const v=S.vcVal||0;
  L.push(civSub('Giá trị làm ra mỗi lao động',fmt(v,1),sat(v/norm,0.6,1.4),'tốt khi ≥ '+fmt(norm*1.4,1)));
  const idle=c.idle||0;L.push(civSub('Người chờ việc',fmtC(idle*HS())+' người',idle/wk<0.05?1:idle/wk<0.15?0.5:0.2,'người chờ việc kéo bình quân xuống'));}
 if(g==='kt'){const kp=(r.know||0)/pop,inv=S.stats.inventions||0,ni=3*S.level+1;
  L.push(civSub('Tri thức mỗi người mỗi năm',fmt(kp,3),sat(kp,0.03,0.14),'tốt khi ≥ 0,14'));
  L.push(civSub('Số phát minh',fmt(inv)+'/'+fmt(ni),sat(inv,0,ni),''));}
 if(g==='tt'){const tp=((r.cult||0)+(r.faith||0)*0.5)/pop,mon=S.buildings.filter(b=>b.type==='monu'||b.type==='shrine').length;
  L.push(civSub('Văn hóa, niềm tin mỗi người mỗi năm',fmt(tp,3),sat(tp,0.01,0.09),'tốt khi ≥ 0,09'));
  L.push(civSub('Miếu thờ, công trình biểu tượng',fmt(mon)+'/'+fmt(S.level+1),sat(mon,0,S.level+1),''));}
 if(g==='xh'){const need=Math.max(3,pop*0.08),mil=S.res.mil||0;
  L.push(civSub('Ổn định xã hội',fmt(S.stab||0),sat(S.stab||0,40,100),'tốt khi ≥ 90'));
  if(S.level>=2)L.push(civSub('Quân lực so với cần',fmt(mil/need*100)+'%',sat(mil/need,0,1),'cần khoảng 8% dân số'));}
 if(g==='hp'){const I=S.idx,hc=S.hpCause||{};
  L.push(civSub('Dân sinh (40%)',fmt(I.ds),I.ds/100,''));L.push(civSub('Tinh thần (25%)',fmt(I.tt),I.tt/100,''));L.push(civSub('Xã hội (20%)',fmt(I.xh),I.xh/100,''));
  if(hc.mono)L.push(civSub('Dồn quá đông vào '+jobName(hc.mono),'−',0,'một nghề không nên quá 50% lao động'));
  if(hc.mil)L.push(civSub('Quân dịch nặng','−',0,'lính không nên quá 15% lao động'));
  if(hc.idle)L.push(civSub('Nhiều người không có việc','−',0,'giao việc cho người chờ'));}
 return L.join('');
}
function civHow(g){
 const H=[],j=(ids,t)=>{const a=civJobs(ids);const n=civNext(ids);if(a.length||n)H.push(`<span>${t}</span><br>${a.join(' ')}${n?(a.length?' <small>sắp có</small> ':'')+n:''}`)};
 if(g==='ds'){j(['farm','fish','herd','gather','hunt'],'Thêm người làm ra lương thực');j(['build'],'Thêm Thợ xây để dựng nhà');j(['doctor'],'Thêm Thầy thuốc để sống lâu hơn');H.push('Lương thực là gốc của Dân sinh: thiếu ăn thì cả Hạnh phúc cũng giảm.')}
 if(g==='vc'){j(['wood','stone','mine'],'Thêm người làm gỗ, đá, kim loại');j(['craft'],'Thợ rèn làm công cụ, mọi nghề làm nhanh hơn');j(['trade','sailor','service'],'Buôn bán làm ra của cải');H.push('Giao việc cho người đang chờ: người chờ việc vẫn tính là lao động nên kéo chỉ số xuống.')}
 if(g==='kt'){j(['scholar','printer','it','space'],'Thêm người làm ra tri thức');H.push('Phát minh tự đến khi tri thức đủ cao; chọn thẻ có “Tri thức +” khi lên cấp.')}
 if(g==='tt'){j(['priest','monk','artisan','service'],'Thêm người làm văn hóa, niềm tin');H.push('Bấm 🎉 Mở lễ hội bên dưới để dân vui, văn hóa tăng.');H.push('Khởi công công trình biểu tượng ở thẻ Mục tiêu; mỗi công trình xong là một mốc tinh thần.')}
 if(g==='xh'){j(['official'],'Quan quản lý giữ ổn định');j(['priest','monk'],'Tư tế, Tu sĩ giữ niềm tin');if(S.level>=2)j(['soldier'],'Giữ lính khoảng 8% dân số');H.push('Chọn thẻ có “Ổn định +” khi lên cấp; tránh đàn áp khi dân nổi dậy.')}
 if(g==='hp'){H.push('Nâng ba nhóm Dân sinh, Tinh thần, Xã hội.');H.push('Không dồn quá nửa lao động vào một nghề; không để lính quá 15%.');H.push('Bấm 🎉 Mở lễ hội khi dân buồn.')}
 return'<ul>'+H.map(x=>`<li>${x}</li>`).join('')+'</ul>';
}
function civCards(I){
 const keys=GROUPS.map(g=>g[0]);let low=keys[0];for(const k of keys)if(I[k]<I[low])low=k;
 const row=(k,ic,name,col,v,w)=>`<div class="gcard${CIVOPEN===k?' open':''}" data-gi="${k}"><div class="gh"><span class="gn" style="color:${col}">${ic} ${name}</span>${k===low&&v<70?'<span class="gw">Yếu nhất</span>':''}<span class="gb"><i style="width:${Math.max(3,v)}%;background:${col}"></i></span><span class="gv">${Math.round(v)}</span><span class="gx">${CIVOPEN===k?'▾':'▸'}</span></div>${CIVOPEN===k?`<div class="gd"><p>${GDESC[k]}</p>${w?`<p class="hint">Chiếm ${w}% Chỉ số Văn minh.</p>`:''}<div class="gt">ĐANG TÍNH TỪ</div>${civParts(k)}<div class="gt">CÁCH TĂNG</div>${civHow(k)}</div>`:''}</div>`;
 const IC={ds:'🍚',vc:'📦',kt:'🔬',tt:'🪷',xh:'🏛️'};
 return`<p class="hint">Bấm vào từng nhóm để xem ý nghĩa và cách tăng. Nhóm thấp nhất kéo cả làng chậm lại: nên lo nhóm yếu trước để phát triển cân bằng.</p><div class="gcards">${GROUPS.map(g=>row(g[0],IC[g[0]],g[1],g[2],I[g[0]],GWT[g[0]])).join('')}${row('hp',I.hp>=60?'😊':I.hp>=40?'😐':'😟','Hạnh phúc','#e3b34c',I.hp,0)}</div>`;
}
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.gcard>.gh');if(!h)return;const k=h.parentNode.dataset.gi;CIVOPEN=CIVOPEN===k?null:k;
 if(REPON&&REPT==='civ')renderRep(true);else if(curTab==='civ')renderPanel();
 setTimeout(()=>{const el=document.querySelector(`.gcard[data-gi="${k}"]`);if(el&&CIVOPEN===k&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'})},30)});

function forkFit(F,ab){return F.tr===3||(F.tr===1&&ab==='a')||(F.tr===2&&ab==='b')?1:.75}
function showFork(F,lv){const mk=ab=>{const o=F[ab],f=forkFit(F,ab),lb=fitLabel(f);
  return{t:o.t,col:f>=1?'#7fd07a':'#e0c060',sub:`${o.d} · ${Object.entries(o.m).map(([a,v])=>fmtMod(a,v)+' '+(MODN[a]||a)).join(', ')}${o.later?' · về sau có thay đổi':''}<br><b style="color:${lb[1]}">${f>=1?'⭐ Gần truyền thống vùng':'Ngược truyền thống – khó lúc đầu'}</b>`,on:()=>pickFork(F,lv,ab)}};
 queueModal({title:`🔀 Ngã rẽ: ${F.q}`,sub:`Cấp ${lv} · ${CONT[S.cont].n}. Không có lựa chọn đúng tuyệt đối; xem sử đã chọn gì ở cuối.`,opts:[mk('a'),mk('b')]})}
function pickFork(F,lv,ab){const o=F[ab],f=forkFit(F,ab);S.forks=S.forks||{};S.forks[lv]={ab,t:o.t,y:S.year};
 for(const[a,v]of Object.entries(o.m))S.mods[a]=(S.mods[a]||0)+v;if(o.later)S.forkLater=(S.forkLater||[]).concat([{m:o.later,lv:lv+1,t:o.t}]);
 S.fitX=S.fitX||[];S.fitX.push({g:'E',id:'fork'+lv,t:o.t,f,n:1,y:S.year});
 logMsg(`🔀 Ngã rẽ cấp ${lv}: chọn “${o.t}”. 📖 Sử chọn: ${F.su}`);toast(`📖 Sử chọn: ${F.su}`,6000);updDiff()}
function forkLaterTick(){if(!S.forkLater||!S.forkLater.length)return;const due=S.forkLater.filter(x=>S.level>=x.lv);if(!due.length)return;S.forkLater=S.forkLater.filter(x=>S.level<x.lv);
 for(const x of due){for(const[a,v]of Object.entries(x.m))S.mods[a]=(S.mods[a]||0)+v;logMsg(`🔀 Hệ quả về sau của “${x.t}”: ${Object.entries(x.m).map(([a,v])=>fmtMod(a,v)+' '+(MODN[a]||a)).join(', ')}.`)}}
{const _md=maybeDecision;maybeDecision=function(){const r=_md.apply(this,arguments);try{if(modalOpen||!S.cont||S.kid)return r;
  if(!S.infra&&!S.infraAsk&&S.level>=2&&S.decks['2a']&&S.tlv>=6){S.infraAsk=1;showInfra();return r}
  const F=FORKS[S.cont]&&FORKS[S.cont][S.level];S.forks=S.forks||{};if(F&&!S.forks[S.level]&&!S.forkAsk?.[S.level]&&S.tlv>=8){S.forkAsk=S.forkAsk||{};S.forkAsk[S.level]=1;showFork(F,S.level)}
  infraGrow();forkLaterTick()}catch(e){console.error(e)}return r}}
